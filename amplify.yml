version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*


# NOTE: Security headers live in customHttp.yml (project root), not here —
# Amplify Hosting does not read a `customHeaders` key from this build-spec
# file. Redirects/rewrites live in the Amplify Console under
# Hosting -> Rewrites and redirects (also not read from this file).
