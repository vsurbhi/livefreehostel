  # --- Routing fallback (fixes B01: every route except / returned 404) ---
  # Any path not matched above and not a real prerendered file falls through
  # to our on-brand 404 page, with a genuine 404 status.
  - source: '/<*>'
    target: '/404.html'
    status: '404'
